name: respiracare
description: "RespiraCare — Mobile telemonitoring platform for COPD and chronic respiratory failure patients."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^13.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Environment Variables Management
  flutter_dotenv: ^5.1.0

  # Local Storage & Session Persistence
  shared_preferences: ^2.2.2

  # Object Value Comparison Utility
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/videos/
